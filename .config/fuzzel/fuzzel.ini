# options
font=Cid Mono Nerd Font:size=10
dpi-aware=auto
prompt="> "
password-character=*
show-actions=no
terminal=foot
list-executables-in-path=no
exit-on-keyboard-focus-loss=no

# icons
icon-theme=Papirus-Dark
icons-enabled=yes

# style
lines=14
width=30
tabs=8
horizontal-pad=40
vertical-pad=8
inner-pad=10

[border]
width=2
radius=8

[colors]
background=282828FF        # dark background
border=3c3836FF            # subtle border
input=ebdbb2FF             # input text (light cream)
match=d79921FF             # matched text (yellow)
prompt=83a598FF            # prompt text (bluish gray)
selection-match=d65d0eff   # selected match (orange)
selection-text=282828FF    # selected text (dark for contrast)
selection=fbf1c7FF         # selection background (light cream)
text=ebdbb2FF              # regular text
